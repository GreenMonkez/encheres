<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Enchères</title>
</head>
<body>
<div th:replace="~{fragments/fragment-entete :: entete}"></div>


	<form th:action="@{/login}" method="POST"  >
		
			
		<ul>
			<li>
				<label for="idUsername">Identifiant :</label>
				<input id="idUsername" type="text" name="username"/>
			</li>
			<li>
				<label for="idPassword">Mot de passe :</label>
				<input id="idPassword" type="password" name="password"/>
			</li>
					
			<li>
				<button type="submit">Connexion</button>
			</li>
			
			<li>
				<a th:href="@{/inscription}">Créer un compte</a>
			</li>
		</ul>
	
	
	</form>
	
	
	
</body>
</html>
